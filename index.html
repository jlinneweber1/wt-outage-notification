<!DOCTYPE html>
<html lang="en" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W&amp;T Offshore — IT Outage Notification System</title>
<style>
:root {
  --red: #B00020;
  --amber: #D9A300;
  --green: #00843D;
  --blue: #005DAA;
  --ink: #222222;
  --bg: #f3f4f6;
  --card: #ffffff;
  --border: #d9d9d9;
  --muted: #666666;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: Calibri, "Segoe UI", Arial, sans-serif; }
#app { padding: 28px 16px 60px; }
.wrap { max-width: 860px; margin: 0 auto; }

.app-header { margin-bottom: 14px; }
.brand { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.app-header h1 { margin: 4px 0 4px; font-size: 26px; }
.sub { margin: 0 0 16px; color: var(--muted); font-size: 14px; }

.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 18px; }
.tab {
  border: none; background: none; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 14px;
  color: var(--muted); padding: 10px 16px; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: color .15s;
}
.tab:hover { color: var(--ink); }
.tab-active { color: var(--red); border-bottom-color: var(--red); }
.tab-count { background: #eee; color: var(--ink); font-size: 11px; padding: 1px 7px; border-radius: 999px; margin-left: 4px; }
.tab-active .tab-count { background: #fbe4e8; color: var(--red); }

.tracker-hint { font-size: 13px; color: var(--muted); }
.tracker-hint a { color: var(--blue); text-decoration: none; font-weight: 600; }
.tracker-hint a:hover { text-decoration: underline; }

.sp-error-banner {
  background: #fff4e5; border: 1px solid var(--amber); color: #7a5200; border-radius: 8px;
  padding: 10px 14px; font-size: 13px; margin-bottom: 14px; line-height: 1.5;
}

.recipients-bar {
  display: flex; align-items: center; gap: 10px;
  background: #fff; border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 14px; margin-bottom: 16px; flex-wrap: wrap;
}
.recipients-label { font-weight: 700; font-size: 13px; color: var(--muted); }
.recipients-input { flex: 1; min-width: 260px; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 13px; font-family: inherit; }
.recipients-hint { font-size: 11px; color: var(--muted); }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 18px; overflow: hidden; }
.card-head { padding: 12px 16px; font-weight: 700; font-size: 14px; color: #fff; }
.card-head-red { background: var(--red); }
.card-head-amber { background: var(--amber); color: #000; }
.card-head-green { background: var(--green); }
.card-head-neutral { background: #eeeeee; color: #333; }

.form { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.form label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: #333; }
.form .opt { font-weight: 400; color: var(--muted); font-size: 11px; }
.form input, .form textarea {
  font-family: inherit; font-size: 14px; padding: 9px 10px; border: 1px solid var(--border);
  border-radius: 6px; color: var(--ink); background: #fff;
}
.form textarea { min-height: 64px; resize: vertical; }
.form input:focus, .form textarea:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }

.btn { border: none; border-radius: 6px; padding: 11px 18px; font-size: 14px; font-weight: 700; cursor: pointer; color: #fff; align-self: flex-start; transition: opacity .15s; }
.btn:hover { opacity: .88; }
.btn-red { background: var(--red); }
.btn-amber { background: var(--amber); color: #000; }
.btn-green { background: var(--green); }
.btn-outline { background: #fff; color: var(--ink); border: 1px solid var(--border); }
.btn.flash-ok { background: var(--green) !important; color: #fff !important; }
.btn.flash-error { background: #999 !important; }

.incident-card { padding: 16px; }
.incident-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.incident-title { font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.incident-meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
.incident-elapsed { text-align: right; }
.elapsed-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.elapsed-value { font-size: 20px; font-weight: 700; }

.badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; text-transform: uppercase; letter-spacing: .03em; }
.badge-red { background: #fbe4e8; color: var(--red); }
.badge-green { background: #e2f4ea; color: var(--green); }

.countdown-row { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.countdown-box { background: #fafafa; border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; font-weight: 700; font-size: 14px; }
.countdown-box.overdue { background: #fbe4e8; color: var(--red); border-color: var(--red); }
.action-buttons { display: flex; gap: 10px; flex-wrap: wrap; }

.resolved-note { margin-top: 12px; padding: 12px 14px; background: #f4faf6; border-left: 4px solid var(--green); border-radius: 6px; font-size: 14px; margin-bottom: 14px; }

.hist-list { display: flex; flex-direction: column; }
.hist-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #eee; flex-wrap: wrap; }
.hist-item:last-child { border-bottom: none; }
.hist-left { display: flex; align-items: center; gap: 10px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.dot-red { background: var(--red); }
.dot-amber { background: var(--amber); }
.dot-green { background: var(--green); }
.hist-subject { font-size: 13.5px; font-weight: 600; }
.hist-time { font-size: 11.5px; color: var(--muted); }
.hist-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.btn-sm { font-size: 12px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: #fff; cursor: pointer; text-decoration: none; color: var(--ink); font-family: inherit; transition: background .15s; }
.btn-sm:hover { background: #f4f4f4; }
.btn-sm.flash-ok { background: var(--green) !important; color: #fff !important; border-color: var(--green); }
.btn-sm.flash-error { background: #999 !important; color: #fff !important; }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.overlay.hidden { display: none; }
.modal { background: #fff; border-radius: 10px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; }
.modal-head { padding: 14px 18px; font-weight: 700; color: #fff; font-size: 15px; border-radius: 10px 10px 0 0; }
.modal-head-amber { background: var(--amber); color: #000; }
.modal-head-green { background: var(--green); }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

.overlay-inner { background: #fff; border-radius: 10px; width: 100%; max-width: 800px; height: 85vh; position: relative; padding: 10px; }
.overlay-close { position: absolute; top: 6px; right: 10px; font-size: 26px; background: none; border: none; cursor: pointer; color: var(--muted); z-index: 5; }
.preview-frame { width: 100%; height: 100%; border: none; }

/* ---------- Tracker screen ---------- */

.modal-head-red { background: var(--red); }

.filter-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-btn {
  font-size: 12.5px; font-weight: 600; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--border);
  background: #fff; cursor: pointer; font-family: inherit; color: var(--ink); transition: background .15s;
}
.filter-btn:hover { background: #f4f4f4; }
.filter-btn-active { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn-export { font-weight: 700; }

.summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
@media (max-width: 640px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }
.summary-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 14px 12px; text-align: center; }
.summary-value { font-size: 24px; font-weight: 700; color: var(--ink); }
.summary-label { font-size: 11.5px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: .02em; }

.empty-state { padding: 30px 16px; text-align: center; color: var(--muted); font-size: 14px; }

.tracker-list { display: flex; flex-direction: column; }
.tracker-row {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid #eee; flex-wrap: wrap;
}
.tracker-row:last-child { border-bottom: none; }
.tracker-row-main { display: flex; align-items: flex-start; gap: 10px; flex: 1 1 220px; min-width: 200px; }
.tracker-title { font-size: 13.5px; font-weight: 700; }
.problem-tag { font-weight: 400; color: var(--muted); font-size: 12px; }
.tracker-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tracker-row-dates, .tracker-row-metrics { font-size: 12px; color: #333; flex: 1 1 150px; line-height: 1.6; }
.tr-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .02em; margin-right: 4px; }
.tracker-row-actions { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }

.tracker-detail-modal { max-width: 640px; }
.tracker-detail-body { padding: 16px 18px; }
.tracker-detail-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; margin-bottom: 12px; }
@media (max-width: 480px) { .tracker-detail-meta { grid-template-columns: 1fr; } }
.modal-actions-pad { padding: 0 18px 18px; }

</style>

<script>

/* ===================== W&T Offshore IT Outage Notification System ===================== */

const DEFAULT_TO = "WT-ALL-Employees@wtoffshore.com; WT-ALL-Contractors@wtoffshore.com";
const STORAGE_KEY_INCIDENT = "wt-outage:incident";
const STORAGE_KEY_HISTORY = "wt-outage:history";
const STORAGE_KEY_TO = "wt-outage:recipients";
const STORAGE_KEY_ARCHIVE = "wt-outage:archive";
const TWO_HOURS_MS = 2 * 60 * 60 * 1000;

let state = {
  incident: null,      // active incident object, or null
  history: [],         // array of generated email records for the active incident
  recipients: DEFAULT_TO,
  archive: [],          // array of completed incident records (each carries its own .history)
  view: "incident",     // "incident" | "tracker"
  trackerFilter: "month", // "week" | "month" | "quarter" | "all"
};

/* ---------- utilities ---------- */

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;")
    .replace(/\n/g, "<br>");
}

function nowLocalInputValue(offsetMs = 0) {
  const d = new Date(Date.now() + offsetMs);
  d.setSeconds(0, 0);
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function fmtDisplay(inputValue) {
  if (!inputValue) return "";
  const d = new Date(inputValue);
  if (isNaN(d.getTime())) return inputValue;
  return d.toLocaleString(undefined, {
    year: "numeric", month: "short", day: "numeric",
    hour: "numeric", minute: "2-digit"
  });
}

function fmtDuration(ms) {
  if (ms < 0) ms = 0;
  const totalMin = Math.round(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h <= 0) return `${m}m`;
  return `${h}h ${m}m`;
}

function uid() {
  return "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* fill first occurrence of `find` with `value`, once */
function fillOnce(html, find, value) {
  return html.replace(find, escapeHtml(value));
}
/* fill every occurrence of `find` with `value` */
function fillAll(html, find, value) {
  return html.split(find).join(escapeHtml(value));
}

/* ---------- template generators ---------- */

function generateInitialHTML(inc) {
  let html = TEMPLATES.initial;
  html = fillAll(html, "[Service/System Name]", inc.serviceName);
  html = fillAll(html, "[INC-000000]", inc.incidentNumber);
  html = fillAll(html, "[Application / Service / Network / Location]", inc.affectedSystems);
  html = fillAll(html, "[Describe who is affected and what users are experiencing]", inc.businessImpact);
  html = fillOnce(html, "[Date / Time]", fmtDisplay(inc.timeReported));   // Time Reported
  html = fillOnce(html, "[Date / Time]", fmtDisplay(inc.nextUpdateEst));  // Estimated Next Update
  return html;
}

function generateUpdateHTML(inc, upd) {
  let html = TEMPLATES.update;
  html = fillAll(html, "[Service/System Name]", inc.serviceName);
  html = fillAll(html, "[INC-000000]", inc.incidentNumber);
  html = fillAll(html, "[Application / Service / Network / Location]", inc.affectedSystems);
  html = fillOnce(html, "[Current known impact]", upd.businessImpact);
  html = fillOnce(html, "[Update on progress / workaround / vendor status]", upd.currentStatus);
  html = fillOnce(html, "[Date / Time]", fmtDisplay(upd.lastUpdated)); // Last Updated
  html = fillOnce(html, "[Date / Time]", fmtDisplay(upd.nextUpdate));  // Next Update
  return html;
}

function generateRestoredHTML(inc, res) {
  let html = TEMPLATES.restored;
  html = fillAll(html, "[Service/System Name]", inc.serviceName);
  html = fillAll(html, "[INC-000000]", inc.incidentNumber);
  html = fillAll(html, "[Application / Service / Network / Location]", inc.affectedSystems);
  html = fillOnce(html, "[Brief summary of what was resolved]", res.resolutionSummary);
  html = fillOnce(html, "[Date / Time]", fmtDisplay(res.serviceRestored));
  html = fillOnce(html, "[Optional ticket / vendor case number]", res.referenceTicket || "N/A");
  return html;
}

function subjectFor(type, inc) {
  const label = type === "initial" ? "Initial Alert" : type === "update" ? "Status Update" : "Service Restored";
  return `IT ALERT: ${inc.serviceName} - ${label}`;
}

/* ---------- persistence: SharePoint list via Microsoft Graph ---------- */
/*
  Backing store: a SharePoint list called OutageTrackerKV on WT-IT-DOCU-SHARE, with:
    - Title       (single line of text)   -> the storage key
    - JSONValue   (multiple lines of text) -> the JSON string value
  Auth: this page is hosted off-SharePoint (Azure Static Web Apps), so it
  can't rely on a shared browser cookie. Instead it signs the user in with
  MSAL and calls Microsoft Graph with a bearer token. The app is granted
  Sites.Selected access scoped to just this one SharePoint site.
*/

const MSAL_CLIENT_ID = "2f4872e7-4abd-4dd3-9c4d-54430477da27";
const MSAL_TENANT_ID = "63017a85-6882-4075-8f94-9f302bb3eaff";
const GRAPH_SITE_ID = "wtoffshore.sharepoint.com,65db52b9-857f-43f4-a9c4-6ad1935fefe1,143db6a1-7330-48c9-b4ab-51fd31c6f7bc";
const GRAPH_LIST_ID = "606ad1f4-4653-443d-ab8d-fdd90af0725e";
const GRAPH_SCOPES = ["https://graph.microsoft.com/Sites.Selected"];

const msalInstance = new msal.PublicClientApplication({
  auth: {
    clientId: MSAL_CLIENT_ID,
    authority: `https://login.microsoftonline.com/${MSAL_TENANT_ID}`,
    redirectUri: window.location.origin + window.location.pathname,
  },
  cache: { cacheLocation: "sessionStorage" },
});

let msalAccount = null;

async function ensureSignedIn() {
  await msalInstance.initialize();
  const result = await msalInstance.handleRedirectPromise();
  if (result && result.account) msalAccount = result.account;
  if (!msalAccount) {
    const existing = msalInstance.getAllAccounts();
    if (existing.length) msalAccount = existing[0];
  }
  if (!msalAccount) {
    const loginResult = await msalInstance.loginPopup({ scopes: GRAPH_SCOPES });
    msalAccount = loginResult.account;
  }
  return msalAccount;
}

async function getGraphToken() {
  const account = await ensureSignedIn();
  try {
    const result = await msalInstance.acquireTokenSilent({ scopes: GRAPH_SCOPES, account });
    return result.accessToken;
  } catch (e) {
    const result = await msalInstance.acquireTokenPopup({ scopes: GRAPH_SCOPES, account });
    return result.accessToken;
  }
}

function graphItemsUrl() {
  return `https://graph.microsoft.com/v1.0/sites/${GRAPH_SITE_ID}/lists/${GRAPH_LIST_ID}/items`;
}

async function graphFetch(url, options = {}) {
  const token = await getGraphToken();
  const res = await fetch(url, {
    ...options,
    headers: {
      Authorization: `Bearer ${token}`,
      "Content-Type": "application/json",
      ...(options.headers || {}),
    },
  });
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(`Graph request failed (${res.status}): ${text.slice(0, 200)}`);
  }
  return res.status === 204 ? null : res.json();
}

async function spFindItem(key) {
  // Sites.Selected + a small KV list: fetch with fields expanded and filter
  // client-side, since server-side $filter on custom fields needs an
  // indexed column that this list doesn't have.
  const data = await graphFetch(`${graphItemsUrl()}?$expand=fields&$top=200`);
  const match = (data.value || []).find((item) => item.fields && item.fields.Title === key);
  return match || null;
}

const spStorage = {
  async get(key) {
    const item = await spFindItem(key);
    return item ? { key, value: item.fields.JSONValue } : null;
  },

  async set(key, value) {
    const existing = await spFindItem(key);
    if (existing) {
      await graphFetch(`${graphItemsUrl()}/${existing.id}/fields`, {
        method: "PATCH",
        body: JSON.stringify({ JSONValue: value }),
      });
    } else {
      await graphFetch(graphItemsUrl(), {
        method: "POST",
        body: JSON.stringify({ fields: { Title: key, JSONValue: value } }),
      });
    }
    return { key, value };
  },

  async delete(key) {
    const existing = await spFindItem(key);
    if (!existing) return null;
    await graphFetch(`${graphItemsUrl()}/${existing.id}`, { method: "DELETE" });
    return { key, deleted: true };
  },
};

/* ---------- connection status banner ---------- */
/* Unlike the Claude-hosted version, failures here are surfaced — a silent
   failure would let one person's browser drift out of sync with the team
   without anyone noticing. */

let spLastError = null;

function showStorageError(context, err) {
  spLastError = `${context}: ${err && err.message ? err.message : err}`;
  console.error(spLastError);
  renderStatusBanner();
}

function clearStorageError() {
  if (!spLastError) return;
  spLastError = null;
  renderStatusBanner();
}

function renderStatusBanner() {
  const el = document.getElementById("spStatusBanner");
  if (!el) return;
  el.innerHTML = spLastError
    ? `<div class="sp-error-banner">⚠ ${escapeHtml(spLastError)} — changes on this screen may not be saved for the rest of the team. Try refreshing and signing in again; if it persists, the OutageTrackerKV list or the app's Sites.Selected access may need checking.</div>`
    : "";
}

async function loadState() {
  try {
    const inc = await spStorage.get(STORAGE_KEY_INCIDENT);
    state.incident = inc ? JSON.parse(inc.value) : null;
  } catch (e) { state.incident = null; showStorageError("Couldn't load the active incident", e); }
  try {
    const hist = await spStorage.get(STORAGE_KEY_HISTORY);
    state.history = hist ? JSON.parse(hist.value) : [];
  } catch (e) { state.history = []; showStorageError("Couldn't load notification history", e); }
  try {
    const to = await spStorage.get(STORAGE_KEY_TO);
    state.recipients = to ? to.value : DEFAULT_TO;
  } catch (e) { state.recipients = DEFAULT_TO; showStorageError("Couldn't load recipients", e); }
  try {
    const arc = await spStorage.get(STORAGE_KEY_ARCHIVE);
    state.archive = arc ? JSON.parse(arc.value) : [];
  } catch (e) { state.archive = []; showStorageError("Couldn't load the Tracker log", e); }
}

async function saveIncident() {
  try {
    if (state.incident) {
      await spStorage.set(STORAGE_KEY_INCIDENT, JSON.stringify(state.incident));
    } else {
      await spStorage.delete(STORAGE_KEY_INCIDENT);
    }
    clearStorageError();
  } catch (e) { showStorageError("Couldn't save the incident", e); }
}

async function saveHistory() {
  try {
    await spStorage.set(STORAGE_KEY_HISTORY, JSON.stringify(state.history));
    clearStorageError();
  } catch (e) { showStorageError("Couldn't save notification history", e); }
}

async function saveRecipients() {
  try {
    await spStorage.set(STORAGE_KEY_TO, state.recipients);
    clearStorageError();
  } catch (e) { showStorageError("Couldn't save recipients", e); }
}

async function saveArchive() {
  try {
    await spStorage.set(STORAGE_KEY_ARCHIVE, JSON.stringify(state.archive));
    clearStorageError();
  } catch (e) { showStorageError("Couldn't save to the Tracker log", e); }
}

function pushHistory(type, inc, html, plain) {
  state.history.unshift({
    id: uid(),
    type,
    subject: subjectFor(type, inc),
    html,
    plain,
    timestamp: Date.now(),
  });
  saveHistory();
}

/* look up a notification record by id, across the active incident and the archive */
function findHistoryRecord(id) {
  let rec = state.history.find((r) => r.id === id);
  if (rec) return rec;
  for (const inc of state.archive) {
    rec = (inc.history || []).find((r) => r.id === id);
    if (rec) return rec;
  }
  return null;
}

/* look up an incident (active or archived) by id. The active incident's history
   is kept separately in state.history, so attach it for a consistent shape. */
function findIncidentById(id) {
  if (state.incident && state.incident.id === id) {
    return { ...state.incident, history: state.history };
  }
  return state.archive.find((inc) => inc.id === id) || null;
}

/* ---------- clipboard ---------- */

async function copyRichEmail(html, plain, btn) {
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      const item = new ClipboardItem({
        "text/html": new Blob([html], { type: "text/html" }),
        "text/plain": new Blob([plain], { type: "text/plain" }),
      });
      await navigator.clipboard.write([item]);
    } else {
      await navigator.clipboard.writeText(html);
    }
    flashBtn(btn, "Copied ✓");
  } catch (e) {
    try {
      await navigator.clipboard.writeText(html);
      flashBtn(btn, "Copied (HTML source) ✓");
    } catch (e2) {
      flashBtn(btn, "Copy failed", true);
    }
  }
}

function flashBtn(btn, label, isError) {
  if (!btn) return;
  const orig = btn.textContent;
  btn.textContent = label;
  btn.classList.add(isError ? "flash-error" : "flash-ok");
  setTimeout(() => {
    btn.textContent = orig;
    btn.classList.remove("flash-ok", "flash-error");
  }, 1600);
}

function plainSummary(type, inc, extra) {
  const lines = [];
  lines.push(`IT ALERT - ${type === "initial" ? "INITIAL ALERT" : type === "update" ? "STATUS UPDATE" : "SERVICE RESTORED"}`);
  lines.push(`Problem: ${inc.incidentNumber}`);
  lines.push(`Service/System: ${inc.serviceName}`);
  lines.push(`Affected: ${inc.affectedSystems}`);
  Object.keys(extra).forEach((k) => lines.push(`${k}: ${extra[k]}`));
  lines.push("");
  lines.push("IT Service Desk | sd@wtoffshore.com | https://sd.wtoffshore.com | 713-513-8600");
  return lines.join("\n");
}

function mailtoLink(subject, plain) {
  const to = encodeURIComponent(state.recipients.replace(/;\s*/g, ","));
  return `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(plain)}`;
}

/* ---------- actions ---------- */

async function startIncident(form) {
  const inc = {
    id: uid(),
    serviceName: form.serviceName.trim(),
    incidentNumber: form.incidentNumber.trim(),
    affectedSystems: form.affectedSystems.trim(),
    businessImpact: form.businessImpact.trim(),
    timeReported: form.timeReported,
    nextUpdateEst: form.nextUpdateEst,
    status: "investigating",
    createdAt: Date.now(),
    lastUpdated: form.timeReported,
    nextUpdateDue: new Date(form.nextUpdateEst).getTime(),
  };
  state.incident = inc;
  state.history = [];
  await saveIncident();
  await saveHistory();
  const html = generateInitialHTML(inc);
  const plain = plainSummary("initial", inc, {
    "Business Impact": inc.businessImpact,
    "Time Reported": fmtDisplay(inc.timeReported),
    "Estimated Next Update": fmtDisplay(inc.nextUpdateEst),
  });
  pushHistory("initial", inc, html, plain);
  render();
}

async function logStatusUpdate(form) {
  const inc = state.incident;
  const upd = {
    businessImpact: form.businessImpact.trim(),
    currentStatus: form.currentStatus.trim(),
    lastUpdated: form.lastUpdated,
    nextUpdate: form.nextUpdate,
  };
  inc.businessImpact = upd.businessImpact;
  inc.lastUpdated = upd.lastUpdated;
  inc.nextUpdateDue = new Date(upd.nextUpdate).getTime();
  await saveIncident();
  const html = generateUpdateHTML(inc, upd);
  const plain = plainSummary("update", inc, {
    "Business Impact": upd.businessImpact,
    "Current Status": upd.currentStatus,
    "Last Updated": fmtDisplay(upd.lastUpdated),
    "Next Update": fmtDisplay(upd.nextUpdate),
  });
  pushHistory("update", inc, html, plain);
  render();
}

async function markRestored(form) {
  const inc = state.incident;
  const res = {
    resolutionSummary: form.resolutionSummary.trim(),
    serviceRestored: form.serviceRestored,
    referenceTicket: form.referenceTicket.trim(),
  };
  inc.status = "resolved";
  inc.resolvedAt = res.serviceRestored;
  inc.resolutionSummary = res.resolutionSummary;
  inc.referenceTicket = res.referenceTicket;
  await saveIncident();
  const html = generateRestoredHTML(inc, res);
  const plain = plainSummary("restored", inc, {
    "Resolution Summary": res.resolutionSummary,
    "Service Restored": fmtDisplay(res.serviceRestored),
    "Reference Ticket": res.referenceTicket || "N/A",
  });
  pushHistory("restored", inc, html, plain);

  // Archive a full snapshot (including its complete notification history) for the Tracker
  const snapshot = JSON.parse(JSON.stringify(inc));
  snapshot.history = JSON.parse(JSON.stringify(state.history));
  state.archive.unshift(snapshot);
  await saveArchive();

  render();
}

async function startNewIncident() {
  state.incident = null;
  state.history = [];
  await saveIncident();
  await saveHistory();
  render();
}

async function updateRecipients(value) {
  state.recipients = value;
  await saveRecipients();
  render();
}

function setView(view) {
  state.view = view;
  render();
}

function setTrackerFilter(filter) {
  state.trackerFilter = filter;
  render();
}

/* ---------- tracker helpers ---------- */

function filterCutoff(filter) {
  const now = Date.now();
  const DAY = 24 * 60 * 60 * 1000;
  if (filter === "week") return now - 7 * DAY;
  if (filter === "month") return now - 30 * DAY;
  if (filter === "quarter") return now - 90 * DAY;
  return 0; // all time
}

function trackerRows() {
  const rows = state.archive.slice();
  if (state.incident) rows.push({ ...state.incident, history: state.history });
  const cutoff = filterCutoff(state.trackerFilter);
  return rows
    .filter((inc) => (inc.createdAt || 0) >= cutoff)
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
}

function incidentDowntimeMs(inc) {
  if (inc.status !== "resolved" || !inc.resolvedAt) return null;
  return new Date(inc.resolvedAt) - new Date(inc.timeReported);
}

function incidentUpdateCount(inc) {
  return (inc.history || []).filter((h) => h.type === "update").length;
}

function exportCSV(rows) {
  const header = ["Problem Number", "Service/System", "Affected Systems", "Status", "Time Reported", "Service Restored", "Downtime (min)", "Updates Sent", "Resolution Summary", "Reference Ticket"];
  const csvEscape = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const dataRows = rows.map((inc) => {
    const downtime = incidentDowntimeMs(inc);
    return [
      inc.incidentNumber || "",
      inc.serviceName || "",
      inc.affectedSystems || "",
      inc.status === "resolved" ? "Resolved" : "Investigating",
      fmtDisplay(inc.timeReported),
      inc.status === "resolved" ? fmtDisplay(inc.resolvedAt) : "",
      downtime !== null ? Math.round(downtime / 60000) : "",
      incidentUpdateCount(inc),
      inc.resolutionSummary || "",
      inc.referenceTicket || "",
    ];
  });
  const csv = [header, ...dataRows].map((r) => r.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `outage-tracker-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- rendering ---------- */

const root = document.getElementById("app");
let countdownTimer = null;

function statusBadge(inc) {
  if (!inc) return "";
  if (inc.status === "resolved") return `<span class="badge badge-green">Resolved</span>`;
  return `<span class="badge badge-red">Investigating</span>`;
}

function render() {
  if (countdownTimer) clearInterval(countdownTimer);

  let body;
  if (state.view === "tracker") {
    body = renderTrackerScreen();
  } else if (!state.incident) {
    body = renderIntakeScreen();
  } else {
    body = renderDashboard(state.incident);
  }

  root.innerHTML = `<div class="wrap">${renderHeader()}${body}</div>`;
  renderStatusBanner();

  wireNavTabs();
  if (state.view === "tracker") {
    wireTracker();
  } else if (!state.incident) {
    wireIntakeForm();
  } else {
    wireDashboard();
    if (state.incident.status !== "resolved") {
      countdownTimer = setInterval(updateCountdown, 1000);
      updateCountdown();
    }
  }
}

function renderHeader() {
  return `
    <header class="app-header">
      <div class="brand">W&amp;T Offshore · IT Service Desk</div>
      <h1>Outage Notification System</h1>
    </header>
    <div id="spStatusBanner"></div>
    <nav class="tabs">
      <button class="tab ${state.view === "incident" ? "tab-active" : ""}" data-view="incident">Current Incident</button>
      <button class="tab ${state.view === "tracker" ? "tab-active" : ""}" data-view="tracker">Tracker${state.archive.length ? ` <span class="tab-count">${state.archive.length}</span>` : ""}</button>
    </nav>`;
}

function renderRecipientsBar() {
  return `
    <div class="recipients-bar">
      <span class="recipients-label">To</span>
      <input id="recipientsInput" class="recipients-input" value="${state.recipients.replace(/"/g, "&quot;")}" spellcheck="false">
      <span class="recipients-hint">Distribution groups — edit if your alias names differ</span>
    </div>`;
}

function renderIntakeScreen() {
  const nowVal = nowLocalInputValue();
  const nextVal = nowLocalInputValue(TWO_HOURS_MS);
  return `
      <p class="sub">Capture an incident once — Status Updates and the Service Restored notice auto-fill from it.</p>
      ${renderRecipientsBar()}
      <section class="card">
        <div class="card-head card-head-red">Step 1 · Initial Alert intake</div>
        <form id="intakeForm" class="form">
          <div class="grid2">
            <label>Service / System Name
              <input name="serviceName" required placeholder="e.g. VPN Gateway">
            </label>
            <label>Problem Number
              <input name="incidentNumber" required placeholder="e.g. PRB-004821">
            </label>
          </div>
          <label>Affected System(s)
            <input name="affectedSystems" required placeholder="Application / Service / Network / Location">
          </label>
          <label>Business Impact
            <textarea name="businessImpact" required placeholder="Who is affected and what are they experiencing?"></textarea>
          </label>
          <div class="grid2">
            <label>Time Reported
              <input type="datetime-local" name="timeReported" required value="${nowVal}">
            </label>
            <label>Estimated Next Update
              <input type="datetime-local" name="nextUpdateEst" required value="${nextVal}">
            </label>
          </div>
          <button type="submit" class="btn btn-red">Generate Initial Alert</button>
        </form>
      </section>
      ${state.archive.length ? `<p class="tracker-hint">${state.archive.length} past incident${state.archive.length === 1 ? "" : "s"} on record — see the <a href="#" data-view-link="tracker">Tracker</a> tab for weekly/monthly review.</p>` : ""}
  `;
}

function renderDashboard(inc) {
  const opened = new Date(inc.createdAt);
  const elapsed = fmtDuration(Date.now() - inc.createdAt);
  const isResolved = inc.status === "resolved";

  return `
      ${renderRecipientsBar()}

      <section class="card incident-card ${isResolved ? "incident-resolved" : "incident-active"}">
        <div class="incident-top">
          <div>
            <div class="incident-title">${escapeHtml(inc.serviceName)} ${statusBadge(inc)}</div>
            <div class="incident-meta">${escapeHtml(inc.incidentNumber)} &middot; ${escapeHtml(inc.affectedSystems)}</div>
          </div>
          <div class="incident-elapsed">
            <div class="elapsed-label">${isResolved ? "Total downtime" : "Open for"}</div>
            <div class="elapsed-value">${isResolved ? fmtDuration(new Date(inc.resolvedAt) - new Date(inc.timeReported)) : elapsed}</div>
          </div>
        </div>

        ${isResolved ? `
          <div class="resolved-note">Service restored ${fmtDisplay(inc.resolvedAt)}. ${escapeHtml(inc.resolutionSummary)}</div>
          <button id="newIncidentBtn" class="btn btn-outline">Start New Incident</button>
        ` : `
          <div class="countdown-row">
            <div id="countdownBox" class="countdown-box">Loading…</div>
            <div class="action-buttons">
              <button id="logUpdateBtn" class="btn btn-amber">Log Status Update</button>
              <button id="markRestoredBtn" class="btn btn-green">Mark Service Restored</button>
            </div>
          </div>
        `}
      </section>

      ${renderHistorySection(state.history)}
    ${renderUpdateModal()}
    ${renderRestoredModal()}
  `;
}

function typeColor(type) {
  return type === "initial" ? "red" : type === "update" ? "amber" : "green";
}

function renderHistoryList(historyArr) {
  return historyArr.map((rec) => `
      <div class="hist-item">
        <div class="hist-left">
          <span class="dot dot-${typeColor(rec.type)}"></span>
          <div>
            <div class="hist-subject">${escapeHtml(rec.subject)}</div>
            <div class="hist-time">${new Date(rec.timestamp).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}</div>
          </div>
        </div>
        <div class="hist-actions">
          <button class="btn-sm" data-preview="${rec.id}">Preview</button>
          <button class="btn-sm" data-copy="${rec.id}">Copy HTML</button>
          <a class="btn-sm" href="${mailtoLink(rec.subject, rec.plain)}">Open in Outlook</a>
        </div>
      </div>`).join("");
}

function renderHistorySection(historyArr) {
  if (!historyArr.length) return "";
  return `
    <section class="card">
      <div class="card-head card-head-neutral">Notification history</div>
      <div class="hist-list">${renderHistoryList(historyArr)}</div>
    </section>
    ${renderPreviewOverlay()}`;
}

function renderPreviewOverlay() {
  return `
    <div id="previewOverlay" class="overlay hidden">
      <div class="overlay-inner">
        <button id="closePreview" class="overlay-close">&times;</button>
        <iframe id="previewFrame" class="preview-frame"></iframe>
      </div>
    </div>`;
}

function renderUpdateModal() {
  const inc = state.incident;
  const nowVal = nowLocalInputValue();
  const nextVal = nowLocalInputValue(TWO_HOURS_MS);
  return `
    <div id="updateModal" class="overlay hidden">
      <div class="modal">
        <div class="modal-head modal-head-amber">Log Status Update</div>
        <form id="updateForm" class="form">
          <label>Business Impact (current)
            <textarea name="businessImpact" required>${escapeHtml(inc.businessImpact).replace(/<br>/g, "\n")}</textarea>
          </label>
          <label>Current Status — progress / workaround / vendor status
            <textarea name="currentStatus" required placeholder="What's happened since the last update?"></textarea>
          </label>
          <div class="grid2">
            <label>Last Updated
              <input type="datetime-local" name="lastUpdated" required value="${nowVal}">
            </label>
            <label>Next Update
              <input type="datetime-local" name="nextUpdate" required value="${nextVal}">
            </label>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-outline" data-close-modal="updateModal">Cancel</button>
            <button type="submit" class="btn btn-amber">Generate Status Update</button>
          </div>
        </form>
      </div>
    </div>`;
}

function renderRestoredModal() {
  const nowVal = nowLocalInputValue();
  return `
    <div id="restoredModal" class="overlay hidden">
      <div class="modal">
        <div class="modal-head modal-head-green">Mark Service Restored</div>
        <form id="restoredForm" class="form">
          <label>Resolution Summary
            <textarea name="resolutionSummary" required placeholder="Brief summary of what was resolved"></textarea>
          </label>
          <div class="grid2">
            <label>Service Restored
              <input type="datetime-local" name="serviceRestored" required value="${nowVal}">
            </label>
            <label>Reference Ticket <span class="opt">(optional)</span>
              <input name="referenceTicket" placeholder="Ticket / vendor case number">
            </label>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-outline" data-close-modal="restoredModal">Cancel</button>
            <button type="submit" class="btn btn-green">Generate Service Restored Notice</button>
          </div>
        </form>
      </div>
    </div>`;
}

/* ---------- tracker screen ---------- */

function filterLabel(f) {
  return f === "week" ? "This Week" : f === "month" ? "This Month" : f === "quarter" ? "Last 3 Months" : "All Time";
}

function renderTrackerScreen() {
  const rows = trackerRows();
  const resolvedRows = rows.filter((r) => r.status === "resolved");
  const totalDowntimeMs = resolvedRows.reduce((sum, r) => sum + (incidentDowntimeMs(r) || 0), 0);
  const avgDowntimeMs = resolvedRows.length ? totalDowntimeMs / resolvedRows.length : 0;
  const totalUpdates = rows.reduce((sum, r) => sum + incidentUpdateCount(r), 0);
  const openCount = rows.length - resolvedRows.length;

  return `
      <p class="sub">Review incident volume, downtime, and follow-through — filter by period for weekly or monthly reporting.</p>

      <div class="filter-bar">
        <div class="filter-group">
          ${["week", "month", "quarter", "all"].map((f) => `
            <button class="filter-btn ${state.trackerFilter === f ? "filter-btn-active" : ""}" data-filter="${f}">${filterLabel(f)}</button>
          `).join("")}
        </div>
        <button id="exportCsvBtn" class="btn-sm btn-export">Export CSV</button>
      </div>

      <div class="summary-grid">
        <div class="summary-card">
          <div class="summary-value">${rows.length}</div>
          <div class="summary-label">Incidents (${filterLabel(state.trackerFilter)})</div>
        </div>
        <div class="summary-card">
          <div class="summary-value">${openCount}</div>
          <div class="summary-label">Currently Open</div>
        </div>
        <div class="summary-card">
          <div class="summary-value">${fmtDuration(avgDowntimeMs)}</div>
          <div class="summary-label">Avg. Downtime</div>
        </div>
        <div class="summary-card">
          <div class="summary-value">${totalUpdates}</div>
          <div class="summary-label">Status Updates Sent</div>
        </div>
      </div>

      <section class="card">
        <div class="card-head card-head-neutral">Incident log</div>
        ${rows.length ? `<div class="tracker-list">${rows.map(trackerRow).join("")}</div>` : `<div class="empty-state">No incidents in this period.</div>`}
      </section>

      <div id="trackerDetailOverlay" class="overlay hidden">
        <div class="modal tracker-detail-modal">
          <div id="trackerDetailBody"></div>
        </div>
      </div>
      ${renderPreviewOverlay()}
  `;
}

function trackerRow(inc) {
  const resolved = inc.status === "resolved";
  const downtimeMs = incidentDowntimeMs(inc);
  return `
    <div class="tracker-row">
      <div class="tracker-row-main">
        <span class="dot dot-${resolved ? "green" : "red"}"></span>
        <div>
          <div class="tracker-title">${escapeHtml(inc.serviceName)} <span class="problem-tag">${escapeHtml(inc.incidentNumber)}</span></div>
          <div class="tracker-sub">${escapeHtml(inc.affectedSystems)}</div>
        </div>
      </div>
      <div class="tracker-row-dates">
        <div><span class="tr-label">Opened</span> ${fmtDisplay(inc.timeReported)}</div>
        <div><span class="tr-label">Resolved</span> ${resolved ? fmtDisplay(inc.resolvedAt) : "—"}</div>
      </div>
      <div class="tracker-row-metrics">
        <div><span class="tr-label">Downtime</span> ${downtimeMs !== null ? fmtDuration(downtimeMs) : "In progress"}</div>
        <div><span class="tr-label">Updates sent</span> ${incidentUpdateCount(inc)}</div>
      </div>
      <div class="tracker-row-actions">
        ${statusBadge(inc)}
        <button class="btn-sm" data-view-incident="${inc.id}">View</button>
      </div>
    </div>`;
}

function renderTrackerDetail(inc) {
  const resolved = inc.status === "resolved";
  const downtimeMs = incidentDowntimeMs(inc);
  return `
    <div class="modal-head ${resolved ? "modal-head-green" : "modal-head-red"}">${escapeHtml(inc.serviceName)} — ${escapeHtml(inc.incidentNumber)}</div>
    <div class="tracker-detail-body">
      <div class="tracker-detail-meta">
        <div><span class="tr-label">Status</span> ${statusBadge(inc)}</div>
        <div><span class="tr-label">Affected</span> ${escapeHtml(inc.affectedSystems)}</div>
        <div><span class="tr-label">Opened</span> ${fmtDisplay(inc.timeReported)}</div>
        <div><span class="tr-label">Resolved</span> ${resolved ? fmtDisplay(inc.resolvedAt) : "—"}</div>
        <div><span class="tr-label">Downtime</span> ${downtimeMs !== null ? fmtDuration(downtimeMs) : "In progress"}</div>
        <div><span class="tr-label">Updates sent</span> ${incidentUpdateCount(inc)}</div>
      </div>
      ${resolved ? `<div class="resolved-note">${escapeHtml(inc.resolutionSummary || "")}</div>` : ""}
      <div class="hist-list">${renderHistoryList(inc.history || [])}</div>
    </div>
    <div class="modal-actions modal-actions-pad">
      <button type="button" class="btn btn-outline" data-close-modal="trackerDetailOverlay">Close</button>
    </div>`;
}

function updateCountdown() {
  const box = document.getElementById("countdownBox");
  if (!box || !state.incident) return;
  const diff = state.incident.nextUpdateDue - Date.now();
  if (diff <= 0) {
    box.className = "countdown-box overdue";
    box.textContent = `Status update overdue by ${fmtDuration(-diff)} — updates go out every 2 hours until restored`;
  } else {
    box.className = "countdown-box";
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    const pad = (n) => String(n).padStart(2, "0");
    box.textContent = `Next status update due in ${pad(h)}:${pad(m)}:${pad(s)}`;
  }
}

/* ---------- wiring ---------- */

function wireNavTabs() {
  document.querySelectorAll("[data-view]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      setView(btn.getAttribute("data-view"));
    });
  });
  document.querySelectorAll("[data-view-link]").forEach((link) => {
    link.addEventListener("click", (e) => {
      e.preventDefault();
      setView(link.getAttribute("data-view-link"));
    });
  });
}

function wireIntakeForm() {
  const form = document.getElementById("intakeForm");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    startIncident({
      serviceName: fd.get("serviceName"),
      incidentNumber: fd.get("incidentNumber"),
      affectedSystems: fd.get("affectedSystems"),
      businessImpact: fd.get("businessImpact"),
      timeReported: fd.get("timeReported"),
      nextUpdateEst: fd.get("nextUpdateEst"),
    });
  });
  wireRecipients();
}

function wireRecipients() {
  const input = document.getElementById("recipientsInput");
  if (!input) return;
  input.addEventListener("change", () => updateRecipients(input.value.trim()));
}

function wireDashboard() {
  wireRecipients();
  wireHistoryButtons();

  const newIncidentBtn = document.getElementById("newIncidentBtn");
  if (newIncidentBtn) newIncidentBtn.addEventListener("click", startNewIncident);

  const logUpdateBtn = document.getElementById("logUpdateBtn");
  if (logUpdateBtn) logUpdateBtn.addEventListener("click", () => openModal("updateModal"));

  const markRestoredBtn = document.getElementById("markRestoredBtn");
  if (markRestoredBtn) markRestoredBtn.addEventListener("click", () => openModal("restoredModal"));

  document.querySelectorAll("[data-close-modal]").forEach((btn) => {
    btn.addEventListener("click", () => closeModal(btn.getAttribute("data-close-modal")));
  });

  const updateForm = document.getElementById("updateForm");
  if (updateForm) {
    updateForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(updateForm);
      logStatusUpdate({
        businessImpact: fd.get("businessImpact"),
        currentStatus: fd.get("currentStatus"),
        lastUpdated: fd.get("lastUpdated"),
        nextUpdate: fd.get("nextUpdate"),
      });
    });
  }

  const restoredForm = document.getElementById("restoredForm");
  if (restoredForm) {
    restoredForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(restoredForm);
      markRestored({
        resolutionSummary: fd.get("resolutionSummary"),
        serviceRestored: fd.get("serviceRestored"),
        referenceTicket: fd.get("referenceTicket") || "",
      });
    });
  }
}

function wireTracker() {
  document.querySelectorAll("[data-filter]").forEach((btn) => {
    btn.addEventListener("click", () => setTrackerFilter(btn.getAttribute("data-filter")));
  });
  const exportBtn = document.getElementById("exportCsvBtn");
  if (exportBtn) exportBtn.addEventListener("click", () => exportCSV(trackerRows()));

  document.querySelectorAll("[data-view-incident]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const inc = findIncidentById(btn.getAttribute("data-view-incident"));
      if (!inc) return;
      document.getElementById("trackerDetailBody").innerHTML = renderTrackerDetail(inc);
      wireHistoryButtons();
      document.querySelectorAll("[data-close-modal]").forEach((b) => {
        b.addEventListener("click", () => closeModal(b.getAttribute("data-close-modal")));
      });
      openModal("trackerDetailOverlay");
    });
  });

  document.querySelectorAll("[data-close-modal]").forEach((btn) => {
    btn.addEventListener("click", () => closeModal(btn.getAttribute("data-close-modal")));
  });

  wireHistoryButtons();
}

function wireHistoryButtons() {
  document.querySelectorAll("[data-preview]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const rec = findHistoryRecord(btn.getAttribute("data-preview"));
      if (!rec) return;
      const overlay = document.getElementById("previewOverlay");
      const frame = document.getElementById("previewFrame");
      frame.srcdoc = rec.html;
      overlay.classList.remove("hidden");
    });
  });
  document.querySelectorAll("[data-copy]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const rec = findHistoryRecord(btn.getAttribute("data-copy"));
      if (!rec) return;
      copyRichEmail(rec.html, rec.plain, btn);
    });
  });
  const closePreview = document.getElementById("closePreview");
  if (closePreview) {
    closePreview.addEventListener("click", () => {
      document.getElementById("previewOverlay").classList.add("hidden");
    });
  }
}

function openModal(id) {
  document.getElementById(id).classList.remove("hidden");
}
function closeModal(id) {
  document.getElementById(id).classList.add("hidden");
}

/* ---------- boot ---------- */

(async function init() {
  try {
    await ensureSignedIn();
  } catch (e) {
    showStorageError("Couldn't sign in", e);
    render();
    return;
  }
  await loadState();
  render();
})();

</script>
</body>
</html>
